<title>Davriy jadval</title>
<style>
:root{--bg:#000;--tabbg:#07080b;--inbg:#07080b;--sheetbg:#0d0f14;--sheetline:#2a2e38;--rowline:#14161c;--kvline:#1a1d24;--grab:#3a3f4b;--swoff:#2a2e38;--onacc:#001330;--card:#0f1116;--card2:#171a21;--line:#252932;--ink:#f3f4f6;--mut:#8a909c;--s:#a33a5e;--p:#8c8222;--d:#1b7ba8;--f:#348a58;--acc:#78aaff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.top button{font-size:18px;width:36px;height:36px;border-radius:18px;background:var(--card2)}
main{flex:1;min-height:0;position:relative}
.view{display:none;position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 6px 16px}
.view.on{display:block}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--tabbg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.act{color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 2px 8px}
.chips button{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:16px;background:var(--card2);font-size:12px;font-weight:600;border:1.5px solid transparent}
.chips button i{width:12px;height:12px;border-radius:3px;display:block}
.chips button.on{border-color:var(--ink)}
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
#wrap{width:100%}#wrap.big{width:250%}
#t{display:grid;grid-template-columns:16px repeat(18,minmax(0,1fr));gap:2px}
.h{display:flex;align-items:center;justify-content:center;font:700 clamp(6px,1.9vw,8px)/1 Georgia,serif;color:var(--mut);min-height:12px}
.big .h{font-size:12px;min-height:20px}
.e{position:relative;aspect-ratio:1/1.25;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1;overflow:hidden;transition:transform .08s}
.e:active{transform:scale(.88)}
.e b{font:700 clamp(8px,2.7vw,12px)/1 Georgia,"Times New Roman",serif}
